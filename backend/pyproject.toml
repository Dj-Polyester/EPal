[project]
name = "epal-backend"
version = "0.1.0"
description = "EPal backend API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0",
    "python-multipart>=0.0.17",
    "redis>=5.2.0",
    "openai>=1.55.0",
    "vllm>=0.20.0",
    "email-validator>=2.2.0",
    "comfy-script[default]>=0.6.0",
    "websockets>=14.1",
    "aiofiles>=24.1.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
